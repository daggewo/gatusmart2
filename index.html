<head>
<meta charset="utf-8">
<title>Stockholm Street Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">

<style>
html, body { 
  margin:0; 
  padding:0; 
  height:100%; 
  font-family:sans-serif; 
}

#map { 
  position:absolute; 
  top:0; 
  bottom:0; 
  width:100%; 
}

/* HUD */
#hud {
  position:absolute;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  color:white;
  font-size:14px;
  font-weight:bold;
  z-index:10;
  padding:4px 12px;
  width:90%;
  max-width:700px;
  justify-content: space-between;
  text-align:center;
}
#hud div { white-space: nowrap; flex: 1; }

/* QUIZ area */
#quiz {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  flex-direction: column;
  gap:4px;
  z-index:10;
  padding:4px;
  box-sizing:border-box;
  background: rgba(0,0,0,0.85);
}




/* Bottom row: prefix + street buttons */
#bottom-row {
  display: flex;
  flex-direction: column; /* stack prefix and streets vertically */
  gap:4px;
  width:100%;
}

/* Typed prefix row */
#typed-row {
  display: flex;
  align-items: center;
  gap: 8px; /* spacing between typed letters and street list */
  padding: 0 6px;
}

#prefix-display {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 50px; /* space for typed letters */
  font-size: 16px;
  font-weight: bold;
  color: white;
  padding: 4px;
  text-align: center;
}



/* Street list container and scrolling */
#street-list-container {
  width:100%;
  overflow-x:auto; /* scroll horizontally if too many streets */
}

#street-list {
  display:flex;
  gap:6px;
  flex-wrap:nowrap; /* single horizontal row */
}

/* Street buttons */
.street-btn {
  flex: 0 0 auto;       /* auto width based on text */
  padding: 6px 12px;
  background: #111;
  color: white;
  border: 1px solid #888;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;  /* prevent wrapping */
  text-align: center;
  cursor: pointer;
}


.floating-check {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 64px;
  font-weight: bold;
  color: #32CD32;                 /* fallback for non-Safari */
  -webkit-text-fill-color: #32CD32; /* iOS Safari fix */
  -webkit-text-stroke: 1px black;   /* black outline for visibility */
  text-shadow: 
    0 0 5px black,
    0 0 10px black,
    0 0 15px black;
  z-index: 9999;
  pointer-events: none;
  animation: pop-check 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
  will-change: transform, opacity;  /* hint to GPU for smoother animation */
}



@keyframes pop-check {
  0% {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }
  60% {
    transform: translate(-50%, -50%) scale(1.4);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}







/* Keyboard container */
#letters {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
  padding: 0 6px 16px;
  box-sizing: border-box;
}

/* Keyboard rows */
.letter-row {
  display: flex;
  justify-content: center;
  gap: 4px;
}

/* All keyboard buttons */
.letter-btn {
  flex: 1 1 0;
  aspect-ratio: 1 / 1.5; /* square keys */
  font-size: 16px;
  border-radius: 6px;
  text-align: center;
  background: #444;
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  min-width: 0;
}

/* Pass button on keyboard */
.letter-btn.pass-btn.transparent-pass {
  background: transparent;   /* remove red background */
  color: white;              /* keep symbol visible */
  font-weight: bold;
  border: none;              /* remove border */
  padding: 0;                /* optional */
  font-size: 24px;           /* make the ⏭ symbol bigger */
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Spacer buttons */
.letter-btn.spacer-btn {
  flex: 1 1 0;
  aspect-ratio: 1 / 1;
  border: none;
  background: transparent;
  pointer-events: none;
}

/* Disabled keys */
.letter-btn.disabled {
  background: rgba(100, 100, 100, 0.2);
  color: rgba(200, 200, 200, 0.5);
  cursor: not-allowed;
}


</style>
</head>

function createLetterButtons() {
  lettersDiv.innerHTML = '';
  letterButtons = [];

  keyboardLayout.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'letter-row';

    row.forEach(key => {
      // Cell container (same for all)
      const cell = document.createElement('div');
      cell.className = 'letter-btn';

      // SPACER
      if (key === '_') {
        cell.classList.add('spacer-btn');

        rowDiv.appendChild(cell);

      const btn = document.createElement('button');

if(key === '💡') {
  btn.id = 'hint-btn';
  btn.textContent = '💡';
  
  // Make it visually like other letter buttons
  btn.style.backgroundColor = '#444'; // same as letters
  btn.style.color = 'white';
  btn.style.fontWeight = '600';
  btn.style.borderRadius = '6px';      // same rounded corners
  
  btn.addEventListener('click', () => {
    if(!currentStreet) return;
    currentPrefix = currentStreet.name[0]; // show first letter
    updatePrefix();
    currentStreet.hinted = true; // mark as hinted
    btn.disabled = true;         // disable hint button
    btn.style.opacity = 0.5;
  });
  
  cell.appendChild(btn);
  rowDiv.appendChild(cell);
  return;
}


if (key === '⏭') {
  btn.id = 'pass-btn-keyboard';
  btn.classList.add('pass-btn');
btn.style.borderRadius = '6px';
  btn.textContent = '?';
  btn.style.backgroundColor = 'red';    // Red background
  btn.style.color = 'white';            // White skull
  btn.addEventListener('click', () => checkAnswer('__PASS__'));
  cell.appendChild(btn);
  rowDiv.appendChild(cell);
  return;
}

      // BACKSPACE
      if (key === '⌫') {
        btn.textContent = '⌫';
        btn.addEventListener('click', () => {
          if (currentPrefix.length > 0) {
            currentPrefix = currentPrefix.slice(0, -1);
            updatePrefix();
          }
        });
        cell.appendChild(btn);
        rowDiv.appendChild(cell);
        letterButtons.push(cell);
        return;
      }

      // LETTER
      btn.textContent = key;
      btn.addEventListener('click', () => {
        if (cell.classList.contains('disabled')) return;
        currentPrefix += key;
        updatePrefix();
      });

      cell.appendChild(btn);
      rowDiv.appendChild(cell);
      letterButtons.push(cell);
    });

    lettersDiv.appendChild(rowDiv);
  });
}






function updatePrefix(){
  prefixDisplay.textContent = currentPrefix;
  updateLetterStates();
  updateStreetList();
}

function updateLetterStates(){
  const prefix = currentPrefix.toLowerCase();

  letterButtons.forEach(btn => {
    const letter = btn.textContent.toLowerCase();
    if(letter === '⌫') return; // skip backspace

    // Check if adding this letter anywhere in a street name is still possible
    const possible = allStreets && allStreets.some(s => {
      if(usedStreets.has(s.name)) return false;
const normalizedStreet = s.name.toLowerCase();
const combined = normalizedStreet.replace(/ü/g, 'u'); // treat ü as u

return combined.includes(prefix + letter);    });

    if(possible) btn.classList.remove('disabled');
    else btn.classList.add('disabled');
  });
}


function updateStreetList(){
  streetListDiv.innerHTML = '';
  if(currentPrefix.length === 0) return;

  const prefixLower = currentPrefix.toLowerCase();

  const filtered = allStreets
    .filter(s => 
      !usedStreets.has(s.name) &&
s.name.toLowerCase().replace(/ü/g,'u').includes(prefixLower)
    )
    .sort((a,b) => a.name.localeCompare(b.name));

  filtered.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'street-btn';
    btn.textContent = s.name;
    btn.addEventListener('click', () => { checkAnswer(s.name); });
    streetListDiv.appendChild(btn);
  });
}


function updateHUD(){ 
  progressDiv.textContent = `Poäng: ${score}`;   // show current score
  livesDiv.textContent = `${'❤️'.repeat(lives)}`; 
  recordDiv.textContent = `Rekord: ${record}`; 
}









function pickRandom(arr,n){
  const result=[];
  const copy=[...arr];
  for(let i=0;i<n;i++){
    const idx=Math.floor(Math.random()*copy.length);
    result.push(copy.splice(idx,1)[0]);
  }
  return result;
}

function highlightStreet(geojson,status){ 
  geojson.features.forEach(f=>f.properties.status=status); 
  if(!map.getSource('answered-streets')) return;
  const answeredSource=map.getSource('answered-streets'); 
  const existing=answeredSource._data.features.filter(
    f=>!geojson.features.some(cf=>cf.geometry.coordinates[0][0]===f.geometry.coordinates[0][0])
  ); 
  answeredSource.setData(turf.featureCollection([...existing,...geojson.features])); 
}

async function fetchStreets(polygon){
  // 1️⃣ Try to load from local cache first
  //const cached = localStorage.getItem('sodermalmStreets');
 // if (cached) {
  //  console.log('Using cached streets');
 //   return JSON.parse(cached);
 // }

  // 2️⃣ Prepare Overpass query
  const coords = polygon.type==='Polygon' ? polygon.coordinates[0] : polygon.coordinates.flat(1);
  const lats = coords.map(c=>c[1]), lngs = coords.map(c=>c[0]);
  const bounds = [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]];
  map.fitBounds(bounds,{padding:50});
  const bbox = [bounds[0][1], bounds[0][0], bounds[1][1], bounds[1][0]];
const query = `[out:json][timeout:200];
(
  way["highway"~"primary|secondary|tertiary|residential|unclassified|service|living_street|footway|pedestrian"]["name"]
  (${bbox[0]},${bbox[1]},${bbox[2]},${bbox[3]});
);
out geom;`;

  // 3️⃣ Fetch from Overpass with error handling
  let dataOSM;
  try {
    const resOSM = await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      body:query,
      headers:{'Content-Type':'application/x-www-form-urlencoded'}
    });

    if (!resOSM.ok) throw new Error('Overpass request failed: ' + resOSM.status);

    try {
      dataOSM = await resOSM.json();
    } catch(e) {
      throw new Error('Invalid JSON from Overpass API: ' + e.message);
    }
  } catch(e) {
    alert('Failed to fetch streets from Overpass: ' + e.message + '\nTry again or reload.');
    return [];
  }

// 4️⃣ Process streets (group by name)
const streetsByName = {};

dataOSM.elements
  .filter(el => el.tags && el.tags.name)
  .forEach(el => {
    const geom = el.geometry.map(pt => [pt.lon, pt.lat]);
    if (!turf.booleanWithin({type:'LineString', coordinates:geom}, polygon)) return;

    const name = el.tags.name;
    if (!streetsByName[name]) {
      streetsByName[name] = {
        name: name,
        highway: el.tags.highway || '',
        surface: el.tags.surface || '',
        ref: el.tags.ref || '',
        oneway: el.tags.oneway || '',
        lanes: el.tags.lanes || '',
        maxspeed: el.tags.maxspeed || '',
        geometries: []
      };
    }
    streetsByName[name].geometries.push(geom);
  });

const streets = Object.values(streetsByName);




  // 5️⃣ Save to local cache
  try {
    localStorage.setItem('sodermalmStreets', JSON.stringify(streets));
    console.log('Streets cached locally');
  } catch(e) {
    console.warn('Could not cache streets locally: ', e.message);
  }




  return streets;
}

// NEXT ROUND FUNCTION
// ----------------------
function nextRound() {
  currentPrefix = "";
  prefixDisplay.textContent = "";

  // Reset hint button
  const hintBtn = document.getElementById('hint-btn');
  if (hintBtn) {
    hintBtn.disabled = false;
    hintBtn.style.opacity = 1;
  }

  // Pick a remaining street
  const remainingStreets = allStreets.filter(s => !usedStreets.has(s.name));
  if (remainingStreets.length < 1) {
    showMessageBox('Game Over', false);
    setTimeout(resetGame, 3000);
    return;
  }

  currentStreet = pickRandom(remainingStreets, 1)[0];
  currentStreet.hinted = false; // reset hint flag
  currentGeoJSON = turf.featureCollection(
    currentStreet.geometries.map(geom => ({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: geom },
      properties: {}
    }))
  );

  // Fit map to current street
  const streetCoords = currentGeoJSON.features.flatMap(f => f.geometry.coordinates);
  const lats = streetCoords.map(c => c[1]), lngs = streetCoords.map(c => c[0]);
  const streetBounds = [
    [Math.min(...lngs) - 0.001, Math.min(...lats) - 0.001],
    [Math.max(...lngs) + 0.001, Math.max(...lats) + 0.001]
  ];
  map.fitBounds(streetBounds, { padding: 120, maxZoom: 15, duration: 1000, essential: true });

  // Update map highlight layer
  if (!highlightSourceAdded) {
    map.addSource(highlightLayerId, { type: 'geojson', data: currentGeoJSON });
    // Black halo behind current street
    map.addLayer({
      id: highlightLayerId + '-halo',
      type: 'line',
      source: highlightLayerId,
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': 'black', 'line-width': 6, 'line-opacity': 0.7 }
    });
    // Actual line of current street
    map.addLayer({
      id: highlightLayerId,
      type: 'line',
      source: highlightLayerId,
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': 'white', 'line-width': 4, 'line-opacity': 0.85 }
    });
    highlightSourceAdded = true;
  } else {
    map.getSource(highlightLayerId).setData(currentGeoJSON);
  }

  updateLetterStates();
  updateStreetList();
  updateHUD();
}


function showFloatingCheck() {
  const check = document.createElement('div');
  check.className = 'floating-check';
  check.textContent = '✔';
  document.body.appendChild(check);

  // Remove after animation completes
  setTimeout(() => check.remove(), 500); // matches animation duration
}



function showStreetLabelOnMap(streetName, geojson) {
  if (!geojson.features || geojson.features.length === 0) return;

  // Pick the first LineString (or you could pick the longest)
  const line = geojson.features[0].geometry;

  // Place the label halfway along the street
  const lineLength = turf.length(line, { units: 'kilometers' });
  const midPoint = turf.along(line, lineLength / 2, { units: 'kilometers' });

  // Update the street-label source with the new point
  map.getSource('street-label').setData(
    turf.featureCollection([{
      type: 'Feature',
      geometry: midPoint.geometry,
      properties: { name: streetName }
    }])
  );

  // Optional: bring label layer on top of highlight layer
  // This ensures it’s not hidden below
  if (map.getLayer('street-label-layer')) {
    map.moveLayer('street-label-layer'); // moves it to top of all layers
  }

  // Remove the label after 1.8 seconds
  setTimeout(() => {
    map.getSource('street-label').setData(
      turf.featureCollection([])
    );
  }, 1800);
}




// Check answer

function checkAnswer(answer) {
  if(!currentStreet) return;

  const isPass = answer === '__PASS__';
  let isCorrect =
    !isPass &&
    answer.trim().toLowerCase() === currentStreet.name.toLowerCase();

  // Highlight street
  highlightStreet(currentGeoJSON, isCorrect ? 'correct' : 'wrong');
  usedStreets.add(currentStreet.name);
  currentStreetIndex++;
  updateHUD();

  if(isCorrect) {
    // Correct but hinted -> no points
    if(currentStreet.hinted){
      showFloatingCheck(); // still show checkmark
      // no score increase
    } else {
      score++;
      if(score > record){
        record = score;
        localStorage.setItem('stockholmStreetRecord', record);
      }
      showFloatingCheck();
    }
    setTimeout(nextRound, NEXT_ROUND_DELAY_CORRECT);
    return;
  }

  // Wrong or pass
  lives--;
  updateHUD();

  // Show correct name on map
  showStreetLabelOnMap(currentStreet.name, currentGeoJSON);

  if(lives === 0){
    setTimeout(resetGame, NEXT_ROUND_DELAY_WRONG + 400);
    return;
  }

  setTimeout(nextRound, NEXT_ROUND_DELAY_WRONG);
}







// Reset
function resetGame(){ 
  lives=3;
  score = 0
  currentStreetIndex=0;
  usedStreets.clear(); 
  if(map.getSource('answered-streets')) map.getSource('answered-streets').setData(turf.featureCollection([])); 
  nextRound(); 
  updateHUD(); 
}

    } else {
      initializeArea(polygon);
    }
  } catch(e) {

  }
}
