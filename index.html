<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Stockholm Street Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

<style>
html, body { 
  margin:0; 
  padding:0; 
  height:100%; 
  font-family:sans-serif; 
}

#map { 
  position:absolute; 
  top:0; 
  bottom:0; 
  width:100%; 
}

/* HUD */
#hud {
  position:absolute;
  top:6px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  color:white;
  font-size:14px;
  font-weight:bold;
  z-index:10;
  padding:4px 12px;
  width:90%;
  max-width:700px;
  justify-content: space-between;
  text-align:center;
}
#hud div { white-space: nowrap; flex: 1; }

/* QUIZ area */
#quiz {
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  display:flex;
  flex-direction: column;
  gap:4px;
  z-index:10;
  padding:4px;
  box-sizing:border-box;
  background: rgba(0,0,0,0.85);
}

/* Invisible overlay to block clicks when message box is shown */
#overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 15;               /* above everything except message box */
  display: none;             /* hide normally */
  background: rgba(0,0,0,0); /* fully transparent */
  cursor: default;           /* normal cursor on overlay */
}


/* Bottom row: prefix + street buttons */
#bottom-row {
  display: flex;
  flex-direction: column; /* stack prefix and streets vertically */
  gap:4px;
  width:100%;
}

/* Typed prefix row */
#typed-row {
  display:flex;
  align-items:center;
  gap:4px;
  padding:0 6px;
}

#prefix-display {
  display: none;
}

#message-box .game-over-title {
  font-size: 32px;    /* bigger than street names */
  font-weight: bold;
  display: block;
  margin-bottom: 8px;
}

#message-box .wrong-title {
  font-size: 28px;       /* slightly smaller for wrong answer */
  font-weight: bold;
}

#message-box .street-name {
  font-size: 20px;    /* smaller than game over */
  font-weight: bold;
  display: block;
  color: red;
}


/* Street list container and scrolling */
#street-list-container {
  width:100%;
  overflow-x:auto; /* scroll horizontally if too many streets */
}

#street-list {
  display:flex;
  gap:6px;
  flex-wrap:nowrap; /* single horizontal row */
}

/* Street buttons */
.street-btn {
  flex: 0 0 auto;       /* auto width based on text */
  padding: 6px 12px;
  background: #111;
  color: white;
  border: 1px solid #888;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;  /* prevent wrapping */
  text-align: center;
  cursor: pointer;
}

/* Keyboard container */
#letters {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
  padding: 0 6px 16px;
  box-sizing: border-box;
}

/* Keyboard rows */
.letter-row {
  display: flex;
  justify-content: center;
  gap: 4px;
}

/* All keyboard buttons */
.letter-btn {
  flex: 1 1 0;
  aspect-ratio: 1 / 1.5; /* square keys */
  font-size: 16px;
  border-radius: 6px;
  text-align: center;
  background: #444;
  color: white;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  min-width: 0;
}

/* Pass button on keyboard */
.letter-btn.pass-btn.transparent-pass {
  background: transparent;   /* remove red background */
  color: white;              /* keep symbol visible */
  font-weight: bold;
  border: none;              /* remove border */
  padding: 0;                /* optional */
  font-size: 24px;           /* make the ⏭ symbol bigger */
  display: flex;
  align-items: center;
  justify-content: center;
}


/* Spacer buttons */
.letter-btn.spacer-btn {
  flex: 1 1 0;
  aspect-ratio: 1 / 1;
  border: none;
  background: transparent;
  pointer-events: none;
}

/* Disabled keys */
.letter-btn.disabled {
  background: rgba(100, 100, 100, 0.2);
  color: rgba(200, 200, 200, 0.5);
  cursor: not-allowed;
}

/* Message Box */
#message-box {
  position:absolute;
  top:50%;
  left:50%;
  transform: translate(-50%,-50%);
  min-width:140px;
  padding:10px 14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  border-radius:8px;
  z-index:20;
  display:none;
}
#message-box.correct { color:#0f0; background: rgba(0,0,0,0.8); border:3px solid #0f0; }
#message-box.wrong { color:#f00; background: rgba(0,0,0,0.8); border:3px solid #f00; }

</style>
</head>

<body>
<div id="map"></div>
<div id="overlay"></div>
<div id="hud">
  <div id="progress">Gata 0 / 0</div>
  <div id="lives">❤️❤️❤️</div>
  <div id="record">Rekord: 0</div>
</div>

<div id="quiz">
  <div id="bottom-row">
  <div id="typed-row">
    <div id="prefix-display"></div>
  </div>
  <div id="street-list-container">
    <div id="street-list"></div>
  </div>
</div>

  <div id="letters"></div>
</div>

<div id="message-box"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoiZGFnZ2U5MyIsImEiOiJjbWtyemxiaDIxM3pjM2NxcjhtNml1dW05In0.CLTKS6_OWkFIBgao72y6iQ';
const map = new mapboxgl.Map({
  container:'map',
  style:'mapbox://styles/dagge93/cmkrzm5eu002s01s97z3t95rv?',
  center:[18.07,59.31],
  zoom:13,
  dragRotate:false,
  touchPitch:false
});
let mapReady=false;
map.once('load',()=>{ mapReady=true; });

let currentPolygon=null;
let allStreets=null;
const usedStreets=new Set();
let highlightLayerId='current-highlight';
let highlightSourceAdded=false;
let currentStreetIndex=0;
let lives=3;
let currentStreet=null;
let currentGeoJSON=null;
let record = Number(localStorage.getItem('stockholmStreetRecord')) || 0;

const progressDiv=document.getElementById('progress');
const livesDiv=document.getElementById('lives');
const recordDiv=document.getElementById('record');

recordDiv.style.cursor = 'pointer'; // show pointer on hover
recordDiv.title = 'Click to reset record'; // optional tooltip

recordDiv.addEventListener('click', () => {
  if(confirm('Are you sure you want to reset the record?')) {
    localStorage.removeItem('stockholmStreetRecord'); // clear storage
    record = 0;                                       // reset variable
    updateHUD();                                      // update display
  }
});

const messageBox=document.getElementById('message-box');
const lettersDiv=document.getElementById('letters');
const streetListDiv=document.getElementById('street-list');
const prefixDisplay=document.getElementById('prefix-display');



let currentPrefix = "";



const keyboardLayout = [
  ['Q','W','E','R','T','Y','U','I','O','P','Å'],
  ['A','S','D','F','G','H','J','K','L','Ö','Ä'],
  ['⏭','_','Z','X','C','V','B','N','M','_','⌫']
];

let score = 0;


let letterButtons=[];


function createLetterButtons() {
  lettersDiv.innerHTML = '';
  letterButtons = [];

  keyboardLayout.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'letter-row';

    row.forEach(key => {
      // Cell container (same for all)
      const cell = document.createElement('div');
      cell.className = 'letter-btn';

      // SPACER
      if (key === '_') {
        cell.classList.add('spacer-btn');
        cell.setAttribute('aria-hidden', 'true');
        rowDiv.appendChild(cell);
        return;
      }

      const btn = document.createElement('button');
      btn.style.all = 'unset';          // reset button styles
      btn.style.width = '100%';
      btn.style.height = '100%';
      btn.style.display = 'flex';
      btn.style.alignItems = 'center';
      btn.style.justifyContent = 'center';
      btn.style.cursor = 'pointer';

      // PASS
if (key === '⏭') {
  btn.id = 'pass-btn-keyboard';
  btn.classList.add('pass-btn');
btn.style.borderRadius = '6px';
  btn.textContent = '?';
  btn.style.backgroundColor = 'red';    // Red background
  btn.style.color = 'white';            // White skull
  btn.addEventListener('click', () => checkAnswer('__PASS__'));
  cell.appendChild(btn);
  rowDiv.appendChild(cell);
  return;
}

      // BACKSPACE
      if (key === '⌫') {
        btn.textContent = '⌫';
        btn.addEventListener('click', () => {
          if (currentPrefix.length > 0) {
            currentPrefix = currentPrefix.slice(0, -1);
            updatePrefix();
          }
        });
        cell.appendChild(btn);
        rowDiv.appendChild(cell);
        letterButtons.push(cell);
        return;
      }

      // LETTER
      btn.textContent = key;
      btn.addEventListener('click', () => {
        if (cell.classList.contains('disabled')) return;
        currentPrefix += key;
        updatePrefix();
      });

      cell.appendChild(btn);
      rowDiv.appendChild(cell);
      letterButtons.push(cell);
    });

    lettersDiv.appendChild(rowDiv);
  });
}






function updatePrefix(){
  prefixDisplay.textContent = currentPrefix;
  updateLetterStates();
  updateStreetList();
}

function updateLetterStates(){
  const prefix = currentPrefix.toLowerCase();
  letterButtons.forEach(btn=>{
    const letter = btn.textContent.toLowerCase();
    if(letter==='⌫') return;
    const possible = allStreets && allStreets.some(s=>{
      if(usedStreets.has(s.name)) return false;
      return s.name.toLowerCase().startsWith(prefix + letter);
    });
    if(possible) btn.classList.remove('disabled');
    else btn.classList.add('disabled');
  });
}

function updateStreetList(){
  streetListDiv.innerHTML='';
  if(currentPrefix.length===0) return;
  const filtered = allStreets
    .filter(s => !usedStreets.has(s.name) && s.name.toLowerCase().startsWith(currentPrefix.toLowerCase()))
    .sort((a,b)=>a.name.localeCompare(b.name));
  filtered.forEach(s=>{
    const btn = document.createElement('button');
    btn.className='street-btn';
    btn.textContent = s.name;
    btn.addEventListener('click', ()=>{ checkAnswer(s.name); });
    streetListDiv.appendChild(btn);
  });
}

function updateHUD(){ 
  progressDiv.textContent = `Gata ${currentStreetIndex+1} / ${allStreets ? allStreets.length : 0}`; 
  livesDiv.textContent = `${'❤️'.repeat(lives)}`; 
  recordDiv.textContent = `Rekord: ${record}`; 
}


function showMessageBox(text, correct = true) {
  const overlay = document.getElementById('overlay');

  // Show overlay to block other clicks
  overlay.style.display = 'block';

  messageBox.innerHTML = text.replace(/\n/g, '<br>');
  messageBox.className = correct ? 'correct' : 'wrong';
  messageBox.style.display = 'block';

  // Only clicking the message box continues
  messageBox.onclick = () => {
    messageBox.style.display = 'none';
    messageBox.onclick = null;
    overlay.style.display = 'none'; // hide overlay

    if (lives === 0) {
      resetGame();   // restart if game over
    } else {
      nextRound();   // go to next street
    }
  };
}





function pickRandom(arr,n){
  const result=[];
  const copy=[...arr];
  for(let i=0;i<n;i++){
    const idx=Math.floor(Math.random()*copy.length);
    result.push(copy.splice(idx,1)[0]);
  }
  return result;
}

function highlightStreet(geojson,status){ 
  geojson.features.forEach(f=>f.properties.status=status); 
  if(!map.getSource('answered-streets')) return;
  const answeredSource=map.getSource('answered-streets'); 
  const existing=answeredSource._data.features.filter(
    f=>!geojson.features.some(cf=>cf.geometry.coordinates[0][0]===f.geometry.coordinates[0][0])
  ); 
  answeredSource.setData(turf.featureCollection([...existing,...geojson.features])); 
}

// Fetch polygon & streets
async function fetchPolygon(areaName = 'Södermalm') {
  // 1️⃣ Try to load from local cache first
  const cached = localStorage.getItem('sodermalmPolygon');
  if (cached) {
    console.log('Using cached Södermalm polygon');
    return JSON.parse(cached);
  }

  // 2️⃣ Build Overpass query to fetch polygon for Södermalm
  const query = `
    [out:json][timeout:25];
    area["name"="${areaName}"]["boundary"="administrative"];
    (relation["name"="${areaName}"]["admin_level"](area););
    out geom;
  `;

  let dataOSM;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: query,
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    });

    if (!res.ok) throw new Error('Overpass request failed: ' + res.status);

    try {
      dataOSM = await res.json();
    } catch (e) {
      throw new Error('Invalid JSON from Overpass API: ' + e.message);
    }

  } catch (e) {
    alert('Failed to fetch polygon from Overpass: ' + e.message);
    return null;
  }

  // 3️⃣ Convert relation to GeoJSON polygon
  if (!dataOSM.elements || dataOSM.elements.length === 0) {
    alert('No polygon found for ' + areaName);
    return null;
  }

  // Pick the first relation with geometry
  const el = dataOSM.elements.find(el => el.type === 'relation' && el.geometry);
  if (!el) {
    alert('No valid relation geometry found for ' + areaName);
    return null;
  }

  // Build GeoJSON Polygon
  const coordinates = el.geometry.map(pt => [pt.lon, pt.lat]);
  const polygon = {
    type: 'Polygon',
    coordinates: [coordinates]
  };

  // 4️⃣ Save to cache
  try {
    localStorage.setItem('sodermalmPolygon', JSON.stringify(polygon));
    console.log('Södermalm polygon cached locally');
  } catch (e) {
    console.warn('Could not cache polygon: ', e.message);
  }

  return polygon;
}





async function fetchStreets(polygon){
  // 1️⃣ Try to load from local cache first
  const cached = localStorage.getItem('sodermalmStreets');
  if (cached) {
    console.log('Using cached streets');
    return JSON.parse(cached);
  }

  // 2️⃣ Prepare Overpass query
  const coords = polygon.type==='Polygon' ? polygon.coordinates[0] : polygon.coordinates.flat(1);
  const lats = coords.map(c=>c[1]), lngs = coords.map(c=>c[0]);
  const bounds = [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]];
  map.fitBounds(bounds,{padding:50});
  const bbox = [bounds[0][1], bounds[0][0], bounds[1][1], bounds[1][0]];
  const query = `[out:json][timeout:200];
    (way["highway"~"primary|secondary|tertiary|residential|unclassified"]["name"]
    (${bbox[0]},${bbox[1]},${bbox[2]},${bbox[3]}););out geom;`;

  // 3️⃣ Fetch from Overpass with error handling
  let dataOSM;
  try {
    const resOSM = await fetch('https://overpass-api.de/api/interpreter',{
      method:'POST',
      body:query,
      headers:{'Content-Type':'application/x-www-form-urlencoded'}
    });

    if (!resOSM.ok) throw new Error('Overpass request failed: ' + resOSM.status);

    try {
      dataOSM = await resOSM.json();
    } catch(e) {
      throw new Error('Invalid JSON from Overpass API: ' + e.message);
    }
  } catch(e) {
    alert('Failed to fetch streets from Overpass: ' + e.message + '\nTry again or reload.');
    return [];
  }

  // 4️⃣ Process streets
  const streetsByName = {};
  dataOSM.elements.filter(el=>el.tags && el.tags.name).forEach(el=>{
    const geom = el.geometry.map(pt=>[pt.lon, pt.lat]);
    if (!turf.booleanWithin({type:'LineString', coordinates:geom}, polygon)) return;
    streetsByName[el.tags.name] ??= [];
    streetsByName[el.tags.name].push(geom);
  });

  const streets = Object.keys(streetsByName).map(name => ({name, geometries: streetsByName[name]}));

  // 5️⃣ Save to local cache
  try {
    localStorage.setItem('sodermalmStreets', JSON.stringify(streets));
    console.log('Streets cached locally');
  } catch(e) {
    console.warn('Could not cache streets locally: ', e.message);
  }

  return streets;
}


// Initialize area and game
async function initializeArea(polygon){
  if(!map.getSource('area')){
    map.addSource('area',{type:'geojson',data:polygon});
    map.addLayer({id:'area-fill',type:'fill',source:'area',paint:{'fill-color':'#FF0000','fill-opacity':0.1}});
    map.addLayer({id:'area-line',type:'line',source:'area',paint:{'line-color':'#FF0000','line-width':3}});
  } else map.getSource('area').setData(polygon);

  allStreets=await fetchStreets(polygon);

  if(!map.getSource('answered-streets')){
    map.addSource('answered-streets',{type:'geojson',data:turf.featureCollection([])});
    map.addLayer({id:'answered-correct',type:'line',source:'answered-streets',
      filter:['==',['get','status'],'correct'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':'lime','line-width':6}});
    map.addLayer({id:'answered-wrong',type:'line',source:'answered-streets',
      filter:['==',['get','status'],'wrong'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':'red','line-width':6}});
  }

  createLetterButtons();
  nextRound();
  updateHUD();
}

// Next round
function nextRound(){
  currentPrefix="";
  prefixDisplay.textContent="";


  const remainingStreets = allStreets.filter(s=>!usedStreets.has(s.name));
  if(remainingStreets.length<1){
    showMessageBox('Game Over', false);
    setTimeout(resetGame,3000);
    return;
  }

  currentStreet = pickRandom(remainingStreets,1)[0];
  currentGeoJSON = turf.featureCollection(
    currentStreet.geometries.map(geom=>({type:'Feature',geometry:{type:'LineString',coordinates:geom},properties:{}}))
  );

  const streetCoords=currentGeoJSON.features.flatMap(f=>f.geometry.coordinates);
  const lats=streetCoords.map(c=>c[1]), lngs=streetCoords.map(c=>c[0]);
  const streetBounds=[[Math.min(...lngs)-0.001,Math.min(...lats)-0.001],[Math.max(...lngs)+0.001,Math.max(...lats)+0.001]];
  map.fitBounds(streetBounds,{padding:120,maxZoom:15,duration:1000,essential:true});

  if(!highlightSourceAdded){
    map.addSource(highlightLayerId,{type:'geojson',data:currentGeoJSON});
    map.addLayer({id:highlightLayerId+'-halo',type:'line',source:highlightLayerId,layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'black','line-width':10}});
    map.addLayer({id:highlightLayerId,type:'line',source:highlightLayerId,layout:{'line-join':'round','line-cap':'round'},paint:{'line-color':'white','line-width':6}});
    highlightSourceAdded=true;
  } else map.getSource(highlightLayerId).setData(currentGeoJSON);

  updateLetterStates();
  updateStreetList();
  updateHUD();
}

function showTemporaryStreetName(name) {
  messageBox.innerHTML = `<span class="street-name">${name}</span>`;
  messageBox.className = 'wrong';  // red style
  messageBox.style.display = 'block';

  setTimeout(() => {
    messageBox.style.display = 'none';
  }, 1500); // hide after 1.5 seconds
}


// Check answer

function checkAnswer(answer) {
  if (!currentStreet) return;

  const isPass = answer === '__PASS__';
  const isCorrect = !isPass && answer.trim().toLowerCase() === currentStreet.name.toLowerCase();

  // Highlight the street
  highlightStreet(currentGeoJSON, isCorrect ? 'correct' : 'wrong');

  usedStreets.add(currentStreet.name);

  // Always increment progress
  currentStreetIndex++;
  updateHUD();

  if (isCorrect) {
    // Only update record on correct answers
score++;

if (score > record) {
  record = score;
  localStorage.setItem('stockholmStreetRecord', record);
}
    localStorage.setItem('stockholmStreetRecord', record);
    showMessageBox('Rätt!', true);
    return;
  }

  // Wrong guess or pass reduces lives
  lives--;
  updateHUD();

  if (lives === 0) {
    showMessageBox(`
      <span class="game-over-title">Game Over</span>
      <span class="street-name">${currentStreet.name}</span>
    `, false);
    return;
  }

  // Wrong guess or pass: show the street name
  showMessageBox(`<span class="street-name">${currentStreet.name}</span>`, false);
}






// Reset
function resetGame(){ 
  lives=3;
  score = 0
  currentStreetIndex=0;
  usedStreets.clear(); 
  if(map.getSource('answered-streets')) map.getSource('answered-streets').setData(turf.featureCollection([])); 
  nextRound(); 
  updateHUD(); 
}

// Start
async function initGame(){
  try{
    const polygon = await fetchPolygon('Södermalm'); // ignored
    currentPolygon = polygon;
    if(!mapReady){
      map.on('load', () => initializeArea(polygon));
    } else {
      initializeArea(polygon);
    }
  } catch(e) {
    alert('Error loading area polygon: ' + e.message);
  }
}
initGame();

</script>
</body>
</html>
